[project]
name = "ai-team-office"
version = "0.1.0"
description = "Multi-agent AppSec pipeline (Grok / xAI) with a live 3D office dashboard"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
]

[dependency-groups]
dev = ["pytest>=8", "bcrypt>=4.2", "PyJWT>=2.9", "pyotp>=2.9"]

[tool.uv]
package = false
